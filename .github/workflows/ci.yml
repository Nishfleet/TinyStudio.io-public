name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run check:render-blocking
      - name: Wrangler config and bundle check
        run: npx wrangler@latest deploy --dry-run

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks detect --source . --no-banner --redact

  # The widened pull_request_target list in agent-dispatch.yml must cover
  # hold-risky's if-list in Nishfleet/fleet-ops@main; that drift is what left
  # review-risky dead on this repo (fleet-ops#9293). Read-only: two public
  # raw fetches, no checkout, no token. Fleet-ops unreachable or its list
  # unreadable fails the job, so a silent pass is impossible.
  trigger-stub:
    name: Trigger stub covers hold-risky
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the stub's pull_request_target types with hold-risky's if-list
        run: |
          curl -fsSL https://raw.githubusercontent.com/Nishfleet/fleet-ops/main/.github/workflows/agent-dispatch.yml -o /tmp/fleet-dispatch.yml
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/workflows/agent-dispatch.yml" -o /tmp/stub.yml
          stub=$(awk '/^  pull_request_target:/,/^  workflow_run:/' /tmp/stub.yml | grep types | grep -o '\[.*\]' | tr -d '[]' | tr ',' '\n' | tr -d ' ' | sort)
          hold=$(awk '/^  hold-risky:/,/^    outputs:/' /tmp/fleet-dispatch.yml | grep -o '"[a-z_]*"' | tr -d '"' | sort -u)
          if [ -z "$hold" ]; then
            echo "::error::could not read hold-risky's if-list from Nishfleet/fleet-ops@main"
            exit 1
          fi
          missing=$(comm -23 <(echo "$hold") <(echo "$stub"))
          if [ -n "$missing" ]; then
            echo "::error::hold-risky needs pull_request_target types the stub does not forward: $missing"
            exit 1
          fi
          echo "stub forwards every type hold-risky's if-list needs: $(echo "$hold" | tr '\n' ' ')"
