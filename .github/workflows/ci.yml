# The product lane: pull request -> these checks -> reviewer App -> merge queue -> deploy.yml.
# Every job also runs on merge_group, because the queue evaluates the required checks on the
# merge group (GitHub docs, "Managing a merge queue"). Each job names the incident or the
# standing rule that keeps it (owner decision 2026-09-11 on 0509#2994: gates need a named incident).
name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # The repository's own test gate (`npm test`, AGENTS.md) plus the config dry run.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No helper scripts
        # Standing rule, no glue (Nish 2026-10-25): a script dir in a product repo is a defect.
        run: test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run check:render-blocking
      - name: Wrangler config and bundle check
        # The lockfile's wrangler, never a floating tag: `npx wrangler@latest` broke every CI
        # run repo-wide on 2026-08-11 (upstream publish E404).
        run: npx --no-install wrangler deploy --dry-run

  secrets:
    # Incidents: leaked Telegram token (fleet-ops#9578) and GitHub login token (fleet-ops#8771).
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --no-banner --redact

  preview:
    # Owner decision 2026-11-01 (fleet-ops#10935): a preview link the owner can click is the last
    # gate of every product PR. Cloudflare Workers Previews through the official action
    # (https://github.com/cloudflare/wrangler-action#workers-previews): one Preview per PR, a
    # GitHub Deployment on the PR and a job summary with the link. The merge group has no PR, so
    # the step is skipped there and the job still reports green.
    name: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview --name pr-${{ github.event.pull_request.number }}
      - run: echo "Preview ${{ steps.preview.outputs.preview-url }}"
