name: Lighthouse
# Audits the live pages against the fleet speed budget after each production deploy, and weekly.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    permissions:
      contents: read
    with:
      urls: |
        https://tinystudio.io/
        https://tinystudio.io/audit
        https://tinystudio.io/pricing
        https://tinystudio.io/msp
        https://tinystudio.io/specimen
