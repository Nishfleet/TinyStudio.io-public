name: answer
# A change request from the reviewer bot on an agent PR, or a failed CI run, goes back to the
# fleet's worker lane, which lives in fleet-ops. The stub needs its own trigger, because "the github
# context is always associated with the caller workflow":
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
on:
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] nothing from the pull request is checked out or run
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  answer:
    # Gate per event: pull_request_review goes through as before; workflow_run only for a
    # red CI run (conclusion failure) on an agent branch (head_branch agent/), so a green CI
    # run does not start a fix round. This stub only filters. What the lane reads from a
    # workflow_run payload is defined in fleet-ops and is not changed or verified here.
    if: >-
      github.event_name == 'pull_request_review' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        startsWith(github.event.workflow_run.head_branch, 'agent/')
      )
    # The lane's job dispatches agent.yml on main with the issue and the PR. A called
    # workflow can only lower the caller's GITHUB_TOKEN permissions, never raise them.
    permissions: {actions: write}
    # @main, not a SHA, the same as the agent stub.
    uses: Nishfleet/fleet-ops/.github/workflows/answer.yml@main
