name: answer
# A change request from the reviewer bot, or a red CI run, on an agent PR goes back to
# the fleet's worker lane, which lives in fleet-ops. The stub needs its own trigger,
# because "the github context is always associated with the caller workflow":
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
on:
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] nothing from the pull request is checked out or run
    workflows: [CI]
    types: [completed]
permissions: {}
# The lane gets no env from this stub: a caller's workflow-level env is not inherited
# by a reusable workflow, only the caller's github context is, per the link in the
# header. The lane reads the PR number out of that context itself, event by event:
# github.event.pull_request.number on a submitted review,
# github.event.workflow_run.pull_requests[0].number on a finished CI run, as the review
# path already did before this file ever set env. The event is data only: the job below
# is a uses: call with no run: step and no checkout, so no PR-controlled string is ever
# interpolated into a script or fetched, which is what the dangerous-triggers ignore
# above claims.
jobs:
  answer:
    # A submitted review starts a fix round. A finished CI run only starts one when the
    # run is red and on an agent branch (agent/*): not a green run, and not a run on
    # main or a merge queue. The comparison is expression-evaluated, not shell, so the
    # head_branch read is not an injection path. This gate is the only agent-PR check
    # this file makes.
    if: >-
      github.event_name == 'pull_request_review' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        startsWith(github.event.workflow_run.head_branch, 'agent/')
      )
    # The lane's job dispatches agent.yml on main with the issue and the PR. A called
    # workflow can only lower the caller's GITHUB_TOKEN permissions, never raise them.
    permissions: {actions: write}
    # @main, not a SHA, the same as the agent stub.
    uses: Nishfleet/fleet-ops/.github/workflows/answer.yml@main
