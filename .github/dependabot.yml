version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Patch and minor updates inside a ^ range touch only the lockfile, which
    # CODEOWNERS leaves unowned, so they auto-merge. A major, or any bump to an
    # exact pin, edits package.json and waits for the owner.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
